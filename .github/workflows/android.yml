name: Android

on:
  push:
    paths:
      - "android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0" "platform-tools" > /dev/null

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yikz-clipboard-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
