name: windows

on:
  push:
    paths:
      - "windows/**"
      - "protocol/**"
      - "VERSION"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "protocol/**"
      - "VERSION"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  core-tests:
    name: Core tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/YikzClipboard.Core.Tests/YikzClipboard.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/YikzClipboard.Core.Tests/YikzClipboard.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory ../artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  app:
    name: App (${{ matrix.rid }})
    needs: core-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/YikzClipboard.App/YikzClipboard.App.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: >
          dotnet publish src/YikzClipboard.App/YikzClipboard.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          --self-contained true
          --no-restore
          -o ../artifacts/publish/${{ matrix.rid }}

      - name: Check output
        shell: pwsh
        run: |
          $exe = Join-Path "../artifacts/publish/${{ matrix.rid }}" "YikzClipboard.exe"
          if (-not (Test-Path $exe)) { throw "YikzClipboard.exe was not produced" }
          $pri = Get-ChildItem "../artifacts/publish/${{ matrix.rid }}" -Filter *.pri
          if ($pri.Count -eq 0) { throw "no .pri resources were produced" }
          Get-ChildItem "../artifacts/publish/${{ matrix.rid }}" | Measure-Object -Property Length -Sum | ForEach-Object { "Publish size: {0:N1} MB" -f ($_.Sum / 1MB) }

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../artifacts/zip | Out-Null
          Compress-Archive -Path "../artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "../artifacts/zip/YikzClipboard-${{ matrix.rid }}.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: YikzClipboard-${{ matrix.rid }}
          path: artifacts/zip/YikzClipboard-${{ matrix.rid }}.zip
          if-no-files-found: error
