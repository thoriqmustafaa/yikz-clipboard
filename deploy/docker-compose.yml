services:
  yikz-clipboard:
    image: ghcr.io/thoriqmustafaa/yikz-clipboard:latest
    container_name: yikz-clipboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - yikz-clipboard-data:/data
    mem_limit: 128m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/yikz-clipboard", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yikz-clipboard-data:
